name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: habitat_match_test}
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres -d habitat_match_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: {elixir-version: '1.20.2', otp-version: '28.2'}
      - run: cd api && mix deps.get
      - run: cd api && mix format --check-formatted
      - run: cd api && MIX_ENV=test DATABASE_URL=ecto://postgres:postgres@localhost/habitat_match_test mix test
      - run: cd api && mix sobelow --config
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.2.20'}
      - run: cd web && bun install
      - run: cd web && bun test
      - run: cd web && bun run build
